];
let cart=[];
function render(){
 let q=document.getElementById("search").value.toLowerCase(),cat=document.getElementById("category").value,sort=document.getElementById("sort").value;
 let list=products.filter(p=>p.name.toLowerCase().includes(q)&&(cat==="all"||p.category===cat));
 if(sort==="low")list.sort((a,b)=>a.price-b.price);if(sort==="high")list.sort((a,b)=>b.price-a.price);
 document.getElementById("grid").innerHTML=list.length?list.map(p=>`
 <article class="product">
  <img src="${p.image}" alt="${p.name}">
  <div class="info"><div class="name" title="${p.name}">${p.name}</div>
   <div class="meta"><span class="stock ${p.stock>0?'green':''}">${p.stock>0?p.stock+' in stock':'Out of stock'}</span><span class="price">${p.range}</span></div>
   <div class="actions"><button onclick="details(${p.id})">Details</button><button class="buy" ${p.stock===0?'disabled':''} onclick="add(${p.id})">Add to cart</button></div>
  </div>
 </article>`).join(""):'<div class="empty">No products found.</div>';
}
function details(id){let p=products.find(x=>x.id===id);alert(p.name+"\n\n"+p.desc+"\n\nPrice: "+p.range+"\nStock: "+p.stock)}
function add(id){let p=products.find(x=>x.id===id);if(!p||p.stock<=0)return;let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});updateCart()}
function remove(id){cart=cart.filter(x=>x.id!==id);updateCart()}
function updateCart(){
 document.getElementById("count").textContent=cart.reduce((s,p)=>s+p.qty,0);
 document.getElementById("cartItems").innerHTML=cart.length?cart.map(p=>`<div class="cartline"><span>${p.name}<br>Qty: ${p.qty} · ${p.range}</span><button class="remove" onclick="remove(${p.id})">Remove</button></div>`).join(""):"Your cart is empty.";
 document.getElementById("total").textContent="See item prices";
}
function toggleCart(v){document.getElementById("overlay").classList.toggle("show",v)}
function checkout(){
 if(!cart.length){alert("Your cart is empty.");return}
 let msg="MODEX STORE ORDER\n"+cart.map(p=>p.name+" x "+p.qty+" — "+p.range).join("\n")+"\n\nPlease confirm availability and total in a Discord ticket.";
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>{alert("Order copied. Paste it in the Discord server.");window.open("https://discord.gg/RB9R7QBGn","_blank")}).catch(()=>{prompt("Copy your order:",msg);window.open("https://discord.gg/RB9R7QBGn","_blank")})}
 else{prompt("Copy your order:",msg);window.open("https://discord.gg/RB9R7QBGn","_blank")}
}
render();updateCart();
</script>
